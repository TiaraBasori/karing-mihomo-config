# ============================================================
#  Clash Meta (mihomo) 规则配置【远程引用版】— KaringX/karing-ruleset
#  按 karing 官方推荐编排(recommend/cn.json)分类其全部规则碎片:
#    直连 64 个碎片 · 去广告 8 个 · 代理 99 个
#  本文件引用 49 个核心碎片(ACL4SSR 上游 Clash 格式, 与 karing sing 分支同源同源码)
#  + MetaCubeX geosite/geoip 22 个 mrs 规则集, 每日自动更新
#  规则集下载走 jsdelivr CDN(国内直连可达); 规则中的下载域名已强制 DIRECT, 首次启动无需代理
#  使用: 将 proxy-providers.nodes.url 改为你的订阅链接
# ============================================================
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 168
geox-url:
  geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxy-providers:
  nodes:
    type: http
    url: "PUT-YOUR-SUBSCRIPTION-URL-HERE"
    path: ./providers/nodes.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
    use:
      - nodes
  - name: "♻️ 自动选择"
    type: url-test
    use:
      - nodes
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: "🛑 广告拦截"
    type: select
    proxies:
      - "REJECT"
      - "DIRECT"
    use:
      - nodes
  - name: "Ⓜ️ 微软服务"
    type: select
    proxies:
      - "🚀 节点选择"
      - "🎯 全球直连"
    use:
      - nodes
  - name: "🍎 苹果服务"
    type: select
    proxies:
      - "🎯 全球直连"
      - "🚀 节点选择"
    use:
      - nodes
  - name: "📲 电报消息"
    type: select
    proxies:
      - "🚀 节点选择"
    use:
      - nodes
  - name: "💬 OpenAI"
    type: select
    proxies:
      - "🚀 节点选择"
    use:
      - nodes
  - name: "📹 油管视频"
    type: select
    proxies:
      - "🚀 节点选择"
    use:
      - nodes
  - name: "🎥 国外媒体"
    type: select
    proxies:
      - "🚀 节点选择"
    use:
      - nodes
  - name: "🎮 游戏平台"
    type: select
    proxies:
      - "🚀 节点选择"
      - "🎯 全球直连"
    use:
      - nodes
  - name: "🎯 全球直连"
    type: select
    proxies:
      - "DIRECT"
      - "🚀 节点选择"
    use:
      - nodes
  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🚀 节点选择"
      - "🎯 全球直连"
    use:
      - nodes

